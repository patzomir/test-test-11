Test DataProduct111 Models:
  extends:
    - .modelling_and_transformation_base
    - .agent_tag
  variables:
    TRANSFORM_ACTION: TEST
    TRANSFORM_MODEL_SELECTOR: tag:data_product_111
    DATAOPS_DATA_PRODUCT_SPECIFICATION_FILE: ${CI_PROJECT_DIR}/${DATA_PRODUCT_SOURCE_FILE}
  stage: Transformation Testing
  script:
    - /dataops
  icon: ${TESTING_ICON}
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/report.xml
